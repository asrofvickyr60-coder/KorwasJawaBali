async function setSt(id,st){const x0=fT(id);if(!x0||x0.st==st)return;let ln='';

 ${act.length?`<div class="kb">${col('proses','▶')}${col('lapor','📝')}</div>${col('pending','⏸')}`:`<div class="card"><h2>Belum ada penugasan aktif untukmu</h2><small style="color:var(--m)">Penugasan muncul di sini kalau namamu tercatat sebagai dalnis, ketua tim, atau anggota.</small></div>`}
